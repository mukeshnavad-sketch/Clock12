<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animated Fantasy Clock</title>
    <link rel="stylesheet" href="CodebyGaurav.css">
</head>
<body>

    <div class="stars"></div>
    
    <div class="clock">
        <div class="ring-outer"></div>
        <div class="ring-runes"></div>
        <div class="dial">
            <span class="num" style="--i:1;"><b>I</b></span>
            <span class="num" style="--i:2;"><b>II</b></span>
            <span class="num" style="--i:3;"><b>III</b></span>
            <span class="num" style="--i:4;"><b>IV</b></span>
            <span class="num" style="--i:5;"><b>V</b></span>
            <span class="num" style="--i:6;"><b>VI</b></span>
            <span class="num" style="--i:7;"><b>VII</b></span>
            <span class="num" style="--i:8;"><b>VIII</b></span>
            <span class="num" style="--i:9;"><b>IX</b></span>
            <span class="num" style="--i:10;"><b>X</b></span>
            <span class="num" style="--i:11;"><b>XI</b></span>
            <span class="num" style="--i:12;"><b>XII</b></span>
            
            <div class="hand hour"></div>
            <div class="hand minute"></div>
            <div class="hand second"></div>
            <div class="pivot"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
